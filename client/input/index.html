<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>入力テスト</title><style>body{font-family:system-ui;padding:16px}button{padding:12px;margin:6px}canvas{border:1px solid #888;width:100%;height:250px;touch-action:none}</style></head><body><h1>入力テスト</h1><p id="connection">接続中...</p><h2>📱 振る</h2><button id="startMotion">振る入力を開始</button><p id="motionStatus">待機中</p><h2>🎤 マイク</h2><button id="startMic">マイク開始</button><button id="stopMic">停止</button><p id="micStatus">待機中</p><h2>✏️ 描く</h2><canvas id="drawing"></canvas><button id="clearDrawing">消去</button><p id="drawStatus">待機中</p><script src="/socket.io/socket.io.js"></script><script>
const socket=io();socket.on('connect',()=>document.getElementById('connection').textContent='接続成功');socket.on('disconnect',()=>document.getElementById('connection').textContent='切断');
const motionStatus=document.getElementById('motionStatus');let motionStarted=false;
document.getElementById('startMotion').addEventListener('click',async()=>{if(motionStarted)return;if(!window.isSecureContext){motionStatus.textContent='HTTPSが必要です';return;}try{if(typeof DeviceMotionEvent==='undefined'){motionStatus.textContent='非対応';return;}if(typeof DeviceMotionEvent.requestPermission==='function'){const result=await DeviceMotionEvent.requestPermission();if(result!=='granted'){motionStatus.textContent='許可されませんでした';return;}}let last=0;window.addEventListener('devicemotion',e=>{const a=e.accelerationIncludingGravity;if(!a||![a.x,a.y,a.z].every(Number.isFinite))return;const now=Date.now();if(now-last<100)return;last=now;const strength=Math.min(1,Math.max(0,(Math.abs(Math.hypot(a.x,a.y,a.z)-9.81)-1)/15));motionStatus.textContent='強度: '+strength.toFixed(2);socket.emit('shake',{strength});});motionStarted=true;motionStatus.textContent='開始しました';}catch(e){motionStatus.textContent='エラー: '+e.message;}});
let stream=null,ctxAudio=null,frame=null;const micStatus=document.getElementById('micStatus');
document.getElementById('startMic').addEventListener('click',async()=>{if(stream)return;try{stream=await navigator.mediaDevices.getUserMedia({audio:true});ctxAudio=new AudioContext();await ctxAudio.resume();const source=ctxAudio.createMediaStreamSource(stream);const analyser=ctxAudio.createAnalyser();analyser.fftSize=2048;source.connect(analyser);const samples=new Float32Array(analyser.fftSize);let last=0;function tick(){analyser.getFloatTimeDomainData(samples);let sum=0;for(const s of samples)sum+=s*s;const volume=Math.min(1,Math.sqrt(sum/samples.length)*5);micStatus.textContent='音量: '+volume.toFixed(2);const now=Date.now();if(now-last>=100){last=now;socket.emit('voice',{volume});}frame=requestAnimationFrame(tick);}tick();}catch(e){micStatus.textContent='エラー: '+e.message;stream?.getTracks().forEach(t=>t.stop());stream=null;if(ctxAudio){await ctxAudio.close();ctxAudio=null;}}});
document.getElementById('stopMic').addEventListener('click',async()=>{if(frame!==null)cancelAnimationFrame(frame);frame=null;stream?.getTracks().forEach(t=>t.stop());stream=null;if(ctxAudio){await ctxAudio.close();ctxAudio=null;}micStatus.textContent='停止中';});
const canvas=document.getElementById('drawing'),ctx=canvas.getContext('2d'),drawStatus=document.getElementById('drawStatus');const rect=canvas.getBoundingClientRect();canvas.width=rect.width;canvas.height=rect.height;let drawing=false,lastDraw=0;const point=e=>{const r=canvas.getBoundingClientRect();return{x:Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),y:Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))};};function send(type,p){const now=Date.now();if(type==='move'&&now-lastDraw<16)return;lastDraw=now;socket.emit('draw',{type,...p});drawStatus.textContent=`座標: ${p.x.toFixed(2)}, ${p.y.toFixed(2)}`;}canvas.addEventListener('pointerdown',e=>{drawing=true;canvas.setPointerCapture(e.pointerId);const p=point(e);ctx.beginPath();ctx.moveTo(p.x*canvas.width,p.y*canvas.height);send('start',p);});canvas.addEventListener('pointermove',e=>{if(!drawing)return;const p=point(e);ctx.lineTo(p.x*canvas.width,p.y*canvas.height);ctx.stroke();send('move',p);});function end(e){if(!drawing)return;drawing=false;send('end',point(e));}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);document.getElementById('clearDrawing').addEventListener('click',()=>{ctx.clearRect(0,0,canvas.width,canvas.height);socket.emit('draw-clear');drawStatus.textContent='消去しました';});
</script></body></html>
